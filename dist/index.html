.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.chip{display:inline-block;padding:2.5px 8px;border-radius:12px;font-size:8pt;font-weight:600}
.chip-up{background:#dcfce7;color:#15803d}
.chip-down{background:#fee2e2;color:#dc2626}
.chip-alert{background:#fef9c3;color:#92400e}

/* ── Recommendation ── */
.rec{border-left:4px solid #2d6a4f;background:#f0faf4;padding:12px 16px;border-radius:0 6px 6px 0}
.rec-title{font-size:13pt;font-weight:700;color:#2d6a4f;margin-bottom:6px;font-family:Georgia,serif}

/* ── Comparable rows ── */
.comp-exc td{color:#888}
.apct-pos{color:#15803d;font-weight:700}
.apct-neg{color:#dc2626;font-weight:700}
.motivo-row td{font-size:8.5pt;color:#555;padding-top:2px;padding-bottom:6px;border-bottom:1px solid #e8e8e8;font-style:italic}

/* ── Preformatted ── */
.pre{font-family:'Courier New',monospace;font-size:8.8pt;background:#f8f8f8;border:1px solid #e0e0e0;border-radius:4px;padding:10px 12px;white-space:pre-wrap;line-height:1.55;overflow-wrap:break-word}

/* ── Narrative text ── */
.narr{line-height:1.7;color:#1a1a1a;text-align:justify}

/* ── Disclaimer ── */
.disclaimer{border-top:1.5px solid #ddd;padding-top:12px;margin-top:24px;font-size:8pt;color:#777;text-align:center;line-height:1.6}

/* ── Misc ── */
.divider{border:none;border-top:1px solid #eee;margin:12px 0}
.page-break{page-break-before:always}
.no-break{page-break-inside:avoid}
.warn-box{margin-top:10px;padding:7px 10px;background:#fff7ed;border:1px solid #fdba74;border-radius:4px;font-size:9pt}
.int-box{padding:10px 12px;background:#f9f9f9;border:1px dashed #bbb;border-radius:4px;font-size:9.5pt;color:#555}

@media print{
  .no-print{display:none}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

\x3C!-- ══ HEADER ══ -->
<div class="hdr">
  <div class="hdr-brand">
    <div class="company">CALDERÓN PROPIEDADES</div>
    <div class="tagline">Matrícula N° 227 &nbsp;·&nbsp; Corredor Público Inmobiliario &nbsp;·&nbsp; Zona Oeste GBA Argentina</div>
  </div>
  <div class="hdr-meta">
    <div class="rtitle">Informe de Tasación</div>
    <div>${q(n)}</div>
    <div>Documento de uso interno exclusivo</div>
  </div>
</div>

\x3C!-- ══ IDENTIFICACIÓN ══ -->
<div class="section no-break">
  <div class="stitle">Identificación del Inmueble</div>
  <table class="dtable">
    ${h("Tipo de propiedad",t.tipoPropiedad)}
    ${h("Country / Barrio cerrado",t.country)}
    ${h("Ubicación",t.ubicacion)}
    ${h("M² cubiertos",t.m2Cubiertos?t.m2Cubiertos+" m²":null)}
    ${h("M² terreno / lote",t.m2Terreno?t.m2Terreno+" m²":null)}
    ${h("Ambientes",t.ambientes&&t.ambientes!=="0"?t.ambientes:null)}
    ${h("Baños",t.banos)}
    ${h("Cocheras",t.cocheras)}
    ${h("Antigüedad",t.antiguedad?t.antiguedad+" años":null)}
    ${h("Estado general",t.estadoGeneral)}
    ${h("Calidad constructiva",t.calidadConstructiva)}
    ${h("Orientación",t.orientacion)}
    ${h("Vista",t.vista)}
    ${h("Situación legal",t.situacionLegal)}
    ${h("Ocupación",t.ocupacion)}
    ${h("Urgencia de venta",t.urgenciaVenta)}
    ${h("Precio pretendido",t.precioPretendido?"USD "+parseFloat(t.precioPretendido).toLocaleString("es-AR"):null)}
  </table>
  ${t.observaciones?`<div style="margin-top:8px;padding:7px 10px;background:#f5f5f0;border-radius:4px;font-size:9.5pt"><strong>Observaciones del corredor:</strong> ${Nt(t.observaciones)}</div>`:""}
</div>

\x3C!-- ══ RESUMEN EJECUTIVO ══ -->
<div class="exec no-break">
  <div class="exec-title">Resumen Ejecutivo de Tasación</div>
  <div class="exec-grid">
    <div class="estat">
      <div class="elabel">Valor probable de mercado</div>
      <div class="evalue">${Et(e.rango_probable)}</div>
      <div class="esub">Rango: ${Et(e.rango_conservador)} – ${Et(e.rango_optimista)}</div>
    </div>
    <div class="estat">
      <div class="elabel">Precio de cierre estimado</div>
      <div class="evalue" style="font-size:12pt">${Et(e.cierre_min)} – ${Et(e.cierre_max)}</div>
      <div class="esub">Margen de negociación: ${e.margen_negociacion??"—"}%</div>
    </div>
    <div class="estat">
      <div class="elabel">Confianza del informe</div>
      <div class="evalue">${e.confianza_pct}%</div>
      <div class="esub">${q(e.confianza_nivel)} &nbsp;·&nbsp; ${c} comparable${c!==1?"s":""}</div>
    </div>
  </div>

  ${t.precioPretendido?`
  <hr class="exec-divider">
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:9.5pt">
    <span><strong>Precio pretendido:</strong> USD ${parseFloat(t.precioPretendido).toLocaleString("es-AR")}</span>
    <div class="sem" style="background:${u}1a;color:${u};border:1.5px solid ${u}">
      <span class="sem-dot" style="background:${u}"></span>
      ${e.desvio_pct>0?"+":""}${e.desvio_pct.toFixed(1)}% &nbsp;·&nbsp; ${q(d)}
    </div>
  </div>`:""}

  ${e.valor_m2_mercado>0||e.valor_m2_propiedad>0?`
  <hr class="exec-divider">
  <div style="display:flex;gap:24px;font-size:9.5pt">
    ${e.valor_m2_mercado?`<div><span style="color:#555">USD/m² promedio zona:</span> <strong>${Math.round(e.valor_m2_mercado).toLocaleString("es-AR")}</strong></div>`:""}
    ${e.valor_m2_propiedad?`<div><span style="color:#555">USD/m² esta propiedad:</span> <strong>${Math.round(e.valor_m2_propiedad).toLocaleString("es-AR")}</strong></div>`:""}
  </div>`:""}
</div>

\x3C!-- ══ RANGO DETALLADO ══ -->
<div class="section no-break">
  <div class="stitle">Rango de Valor de Mercado</div>
  <table>
    <thead><tr><th>Escenario</th><th>Valor estimado</th><th>Criterio</th></tr></thead>
    <tbody>
      <tr><td>Conservador</td><td>${Et(e.rango_conservador)}</td><td style="font-size:9pt;color:#555">Condiciones de mercado desfavorables o baja liquidez</td></tr>
      <tr style="background:#f0faf4"><td><strong>Probable</strong></td><td><strong>${Et(e.rango_probable)}</strong></td><td style="font-size:9pt;color:#2d6a4f"><strong>Valor más probable según comparables de mercado</strong></td></tr>
      <tr><td>Optimista</td><td>${Et(e.rango_optimista)}</td><td style="font-size:9pt;color:#555">Condiciones favorables y comprador motivado</td></tr>
    </tbody>
  </table>
</div>

\x3C!-- ══ VARIABLES ══ -->
${((y=e.variables_suben)==null?void 0:y.length)>0||((w=e.variables_bajan)==null?void 0:w.length)>0||((k=e.variables_alerta)==null?void 0:k.length)>0?`
<div class="section no-break">
  <div class="stitle">Factores que Impactan el Valor</div>
  ${((v=e.variables_suben)==null?void 0:v.length)>0?`<div style="margin-bottom:8px"><div style="font-size:8.5pt;font-weight:700;color:#15803d;margin-bottom:4px">FACTORES POSITIVOS (suman valor)</div><div class="chips">${e.variables_suben.map(x=>`<span class="chip chip-up">↑ ${q(x)}</span>`).join("")}</div></div>`:""}
  ${((f=e.variables_bajan)==null?void 0:f.length)>0?`<div style="margin-bottom:8px"><div style="font-size:8.5pt;font-weight:700;color:#dc2626;margin-bottom:4px">FACTORES NEGATIVOS (restan valor)</div><div class="chips">${e.variables_bajan.map(x=>`<span class="chip chip-down">↓ ${q(x)}</span>`).join("")}</div></div>`:""}
  ${((m=e.variables_alerta)==null?void 0:m.length)>0?`<div><div style="font-size:8.5pt;font-weight:700;color:#92400e;margin-bottom:4px">ALERTAS</div><div class="chips">${e.variables_alerta.map(x=>`<span class="chip chip-alert">⚠ ${q(x)}</span>`).join("")}</div></div>`:""}
</div>`:""}

\x3C!-- ══ METODOLOGÍA ══ -->
<div class="section">
  <div class="stitle">Metodología de Tasación</div>
  <p class="narr">${Nt(e.metodologia)}</p>
</div>

${e.calculo_paso_a_paso?`
<div class="section">
  <div class="stitle">Cálculo Paso a Paso</div>
  <div class="pre">${q(e.calculo_paso_a_paso)}</div>
</div>`:""}

\x3C!-- ══ COMPARABLES ══ -->
${((b=e.comparables_analizados)==null?void 0:b.length)>0?`
<div class="section page-break">
  <div class="stitle">Análisis de Comparables de Mercado (${e.comparables_analizados.length} total · ${i.length} incluidos · ${a.length} descartados)</div>

  ${i.length>0?`
  <div style="font-size:9.5pt;font-weight:700;color:#15803d;margin-bottom:6px">✓ Comparables Incluidos en la Tasación (${i.length})</div>
  <table>
    <thead>
      <tr>
        <th style="width:22%">Propiedad / Fuente</th>
        <th style="width:12%">Precio pub.</th>
        <th style="width:8%">M²</th>
        <th style="width:11%">USD/m² pub.</th>
        <th style="width:9%">Ajuste</th>
        <th style="width:11%">USD/m² adj.</th>
        <th>Motivo del ajuste e inclusión</th>
      </tr>
    </thead>
    <tbody>
      ${i.map(x=>`
      <tr>
        <td><strong>${q(x.titulo)}</strong><br><span style="font-size:8pt;color:#555">${q(x.fuente)}</span></td>
        <td>${x.precio_publicacion?`USD ${Math.round(x.precio_publicacion).toLocaleString("es-AR")}`:"—"}</td>
        <td>${x.m2?`${x.m2} m²`:"—"}</td>
        <td>${x.valor_m2?x.valor_m2.toLocaleString("es-AR"):"—"}</td>
        <td class="${x.ajuste_pct>0?"apct-pos":x.ajuste_pct<0?"apct-neg":""}">${x.ajuste_pct!==0?Ua(x.ajuste_pct):"—"}</td>
        <td style="font-weight:700;color:#2d6a4f">${x.valor_m2_ajustado?x.valor_m2_ajustado.toLocaleString("es-AR"):"—"}</td>

      </tr>`).join("")}
    </tbody>
  </table>`:""}

  <table>
    <thead>
      <tr>
        <th style="width:25%">Propiedad / Fuente</th>
        <th style="width:12%">Precio</th>
        <th style="width:8%">M²</th>
        <th style="width:12%">USD/m²</th>
        <th>Motivo del descarte</th>
      </tr>
    </thead>
    <tbody>
      ${a.map(x=>`
      <tr class="comp-exc">
        <td>${q(x.titulo)}<br><span style="font-size:8pt">${q(x.fuente)}</span></td>
        <td>${x.precio_publicacion?`USD ${Math.round(x.precio_publicacion).toLocaleString("es-AR")}`:"—"}</td>
        <td>${x.m2?`${x.m2} m²`:"—"}</td>
        <td>${x.valor_m2?x.valor_m2.toLocaleString("es-AR"):"—"}</td>
        <td style="font-size:8.5pt">${q(x.motivo_inclusion)}</td>
      </tr>`).join("")}
    </tbody>
  </table>`:""}
</div>`:""}

\x3C!-- ══ AJUSTES ══ -->
${((_=e.ajustes_aplicados)==null?void 0:_.length)>0?`
<div class="section no-break">
  <div class="stitle">Ajustes Aplicados al Valor Base</div>

    </tbody>

  <div class="stitle">Justificación del Valor</div>
  <p class="narr">${Nt(e.justificacion)}</p>
</div>

  <div class="stitle">Nivel de Confianza del Informe</div>
  <table class="dtable">

    <tr><td class="dl">Observación</td><td class="dv" style="font-weight:400">${Nt(e.confianza_nota)}</td></tr>
  </table>
  ${e.requiere_visita?`<div class="warn-box"><strong style="color:#9a3412">⚠ Se recomienda visita presencial:</strong> ${q(e.requiere_visita_motivo)}</div>`:""}
</div>

\x3C!-- ══ RECOMENDACIÓN ══ -->
<div class="section no-break">
  <div class="stitle">Recomendación Estratégica</div>
  <div class="rec">
    <div class="rec-title">${q(e.recomendacion_titulo)}</div>
    <p class="narr">${Nt(e.recomendacion_desc)}</p>
    ${e.recomendacion&&e.recomendacion!==e.recomendacion_desc?`<p style="margin-top:8px;font-size:9pt;color:#555">${Nt(e.recomendacion)}</p>`:""}
  </div>
</div>

\x3C!-- ══ ANÁLISIS VISUAL ══ -->
${e.analisis_visual?`
<div class="section">
  <div class="stitle">Análisis Visual de Fotografías (${t.fotos.length} foto${t.fotos.length!==1?"s":""})</div>
  <p class="narr">${Nt(e.analisis_visual)}</p>
</div>`:""}

\x3C!-- ══ OBSERVACIONES INTERNAS ══ -->
${e.observaciones_internas?`
<div class="section no-break">
  <div class="stitle" style="color:#888;border-color:#bbb">Observaciones Internas — Uso exclusivo del corredor</div>
  <div class="int-box narr">${Nt(e.observaciones_internas)}</div>
</div>`:""}

\x3C!-- ══ DISCLAIMER ══ -->
<div class="disclaimer">
  <p><strong>CALDERÓN PROPIEDADES</strong> &nbsp;·&nbsp; Matrícula N° 227 &nbsp;·&nbsp; Corredor Público Inmobiliario &nbsp;·&nbsp; Zona Oeste GBA Argentina</p>

  <p style="margin-top:4px">Generado con TasadorIA &nbsp;·&nbsp; ${q(n)}</p>
</div>
